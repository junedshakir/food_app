# stories.yaml — single source of truth for story state.
# Lifecycle: ready-for-dev -> in-progress -> review -> done
#   in-progress : set when the feature branch for the story is created
#   review      : set when the PR is opened
#   done        : set after review, issue resolution and merge
# Story IDs are <epic>.<index> (e.g. 1.1). `legacy_id` maps to the numbering in user-stories.md.
# `story_file` is null until the story file is created (done on request, epic by epic).

statuses: [ready-for-dev, in-progress, review, done]

epics:
  - { id: 1, name: Project Foundation }
  - { id: 2, name: Authentication & Accounts }
  - { id: 3, name: Restaurant Onboarding & Admin Approval }
  - { id: 4, name: Menu Management }
  - { id: 5, name: Discovery }
  - { id: 6, name: Cart & Addresses }
  - { id: 7, name: Checkout & Payments }
  - { id: 8, name: Order Fulfilment & Tracking }
  - { id: 9, name: Admin Oversight }
  - { id: 10, name: Hardening & Release }

